# Builds the module and builds and tests the app on every push to a branch
# (not on pull requests; tags run release.yml instead).
name: CI

on:
  push:
    branches: ["**"]

jobs:
  kernel:
    name: Kernel module (${{ matrix.package }})
    strategy:
      matrix:
        # latest (7.2+), and the oldest kernels mct_compat.h covers
        package: [mct-kmod, mct-kmod-6_18, mct-kmod-6_12]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build ".#${{ matrix.package }}" -L

  app:
    name: App (build and tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: app
        run: cargo test --locked
      - working-directory: app
        run: cargo build --release --locked
